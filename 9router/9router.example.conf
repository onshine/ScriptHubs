# Caddy 反向代理示例 —— 9Router 网关 + 仪表板
#
# 用法：把下面这段并入你的 Caddyfile（放文件末尾即可），改掉域名，
#       然后校验并 reload：
#
#           cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%Y%m%d%H%M%S)
#           caddy fmt --overwrite /etc/caddy/Caddyfile
#           caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#           systemctl reload caddy
#
# ⚠️ 校验不通过时**不要** reload —— 原配置仍在运行，服务不受影响。
#    校验失败的完整报错要用下面这条看（systemctl status 的输出会被截断）：
#           caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#           journalctl -xeu caddy.service -n 30 --no-pager | grep -i error

# ─────────────────────────────────────────────────────────────
# 主配置（与现有 18443 那批保持一致的写法）
# ─────────────────────────────────────────────────────────────
# 假设 9router 监听 127.0.0.1:15900（9router.sh 的默认 PORT）。

9router.example.com:18443 {
    tls internal

    encode gzip

    reverse_proxy 127.0.0.1:15900
}

# ─────────────────────────────────────────────────────────────
# 关于 18443 + tls internal：请先确认这是你要的
# ─────────────────────────────────────────────────────────────
#
# 你这个 Caddyfile 里全站都是 `tls internal`（自签）。两个后果：
#
#   1. 浏览器一定报「不安全」。自签证书除非把根证书装进设备信任库，
#      否则每次访问都要点「继续前往」，iOS 上还要去 设置→通用→关于本机
#      →证书信任设置 里手动开。
#
#   2. ⚠️ 9Router 的登录 cookie 带 Secure 标记（本套件默认 AUTH_COOKIE_SECURE=true）。
#      Secure cookie 只走 HTTPS，方案本身没问题 —— 但如果你哪天把
#      AUTH_COOKIE_SECURE 设成 false，或在 http 上试登录，会直接登不进去。
#
# 如果你有公网域名 + 80/443 可达，更省事的写法是砍掉 :18443 和 tls internal，
# 让 Caddy 自动签 Let's Encrypt（证书被所有设备信任，无警告）：
#
#   9router.example.com {
#       encode gzip
#       reverse_proxy 127.0.0.1:15900
#   }
#
# 想保留 18443 但用真证书，也可以显式指定：
#
#   9router.example.com:18443 {
#       tls you@example.com
#       encode gzip
#       reverse_proxy 127.0.0.1:15900
#   }

# ─────────────────────────────────────────────────────────────
# Caddy 相比 nginx 省掉的那些配置（说明用，无需照抄）
# ─────────────────────────────────────────────────────────────
#
# 用 nginx 反代 9Router 时，下面这些都是必须手写的，漏一个就出问题：
#
#   proxy_buffering off;                          # 不关 → SSE 流式响应被攒成一坨
#                                                 #       AI 对话变成"打完字才一次性吐出来"
#   proxy_set_header X-Forwarded-Proto $scheme;   # 漏了 → 应用判定不出 HTTPS，
#                                                 #       认证 cookie 的 Secure 标记逻辑出错
#   proxy_set_header X-Forwarded-For ...;         # 真实 IP 链路（9Router 有登录限流，按 IP 记）
#   proxy_set_header Connection "";               # SSE 长连接
#   proxy_read_timeout 600s;                      # 默认 60s，长回答会被掐断
#
# Caddy 全部默认就对：
#   · 默认 flush_interval 为 -1（不缓冲）→ SSE/流式开箱可用
#   · 默认以 $remote_addr 覆盖写入 X-Forwarded-For 与 X-Forwarded-Proto
#   · 默认无读超时上限
# 所以最小配置就是上面那 5 行，不需要额外 header_up。
#
# ─────────────────────────────────────────────────────────────
# ⚠️ 9Router 特有的一条：这里的 no-op 是「故意」的
# ─────────────────────────────────────────────────────────────
#
# 9Router 的 custom-server.js 会**主动删掉**客户端传来的 X-Forwarded-For，
# 只在 TCP 对端是回环（即 Caddy 在宿主机上）时才信这个头。
# 它的登录限流按这个 IP 计数 —— 这是防伪造的正确做法，别想着绕过。
#
# 副作用：如果你在 Caddy 前面又挂了 Cloudflare，看到的所有访客 IP 都会是
# Caddy 的地址（也就是 127.0.0.1），此时：
#   · 登录失败限流会变成"全站共用一个计数器" → 别人输错密码可能把你锁住
#   · 仪表板的访客 IP 显示无意义
# 缓解办法是不要在 Caddy 前面加 CF 代理（直连 Caddy），或者给 9Router 前面
# 再加一层可信的来源限制。自用场景下最简单的就是不加 CF。

# ─────────────────────────────────────────────────────────────
# 可选：加 IP 白名单
# ─────────────────────────────────────────────────────────────
# 这个网关持有你全部上游账号的 OAuth token（Claude / Codex / Copilot），
# 并且 /v1 接口能直接消耗你的额度。虽然有登录密码 + REQUIRE_API_KEY 双保险，
# 但如果只是自己用，建议直接锁来源 IP。
#
#   9router.example.com:18443 {
#       tls internal
#       encode gzip
#
#       @allow {
#           remote_ip 127.0.0.1 ::1
#           remote_ip 203.0.113.10       # 你的固定出口 IP
#           remote_ip 198.51.100.0/24    # 或网段
#       }
#       handle @allow {
#           reverse_proxy 127.0.0.1:15900
#       }
#       handle {
#           respond "Forbidden" 403
#       }
#   }
#
# ⚠️ 三个坑：
#   1. 白名单里必须有你自己的 IP，否则会把自己锁在外面
#      （改完先在另一个终端确认能访问，再关掉当前会话）。
#   2. 手机出门走的是运营商/代理出口，IP 会变。如果只有你自己用、
#      且经常在移动网络下，白名单可能比密码更碍事 —— 按实际情况取舍。
#   3. 用了 Cloudflare 代理（橙云）时，服务器看到的是 CF 回源 IP 而不是
#      访客真实 IP，白名单要以 CF 网段为准。但见上面那条：CF + 9Router
#      的限流会互相干扰，自用不建议加 CF。
