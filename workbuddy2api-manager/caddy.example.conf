# Caddy 反向代理示例 —— workbuddy-manager 管理面板
#
# 用法：把下面这段并入你的 Caddyfile（放在文件末尾即可），改掉域名，
#       然后校验并 reload：
#
#           caddy fmt --overwrite /etc/caddy/Caddyfile
#           caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#           systemctl reload caddy
#
# ⚠️ 校验不通过时**不要** reload —— 原配置仍在运行，服务不受影响。
#    校验失败的完整报错要用下面这条看（systemctl status 的输出会被截断）：
#           caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

# ─────────────────────────────────────────────────────────────
# 最小可用配置
# ─────────────────────────────────────────────────────────────
# 假设面板监听 127.0.0.1:17864（deploy.sh 的默认值）。

workbuddy.example.com {
    # 证书：有公网域名 + 80 端口可达时，写你的邮箱即可自动申请 Let's Encrypt
    tls you@example.com
    # 若不想暴露域名 / 无公网 80 端口，改用自签（浏览器会提示不安全）：
    # tls internal

    # 面板必须经 HTTPS 访问：会话 Cookie 带 Secure 标记，
    # 用 http 访问会登录不上（浏览器不会发送 Secure Cookie）。
    encode gzip

    reverse_proxy 127.0.0.1:17864 {
        # 面板判定真实客户端 IP 的**首选依据**是 X-Real-IP，
        # 而 Caddy 默认不发这个头（它默认发 X-Forwarded-For / X-Forwarded-Proto）。
        # 不补的话面板会回退去解析 X-Forwarded-For，也能工作；
        # 显式补上语义更清晰，与 nginx 的
        #   proxy_set_header X-Real-IP $remote_addr;
        # 等价。
        header_up X-Real-IP {remote_host}
    }
}

# ─────────────────────────────────────────────────────────────
# Caddy 相比 nginx 省掉的那些配置（说明用，无需照抄）
# ─────────────────────────────────────────────────────────────
#
# 用 nginx 反代面板时，下面这些都是必须手写的，漏一个就出问题：
#
#   proxy_buffering off;                          # 不关 → 流式响应被攒成一坨
#   proxy_set_header X-Forwarded-Proto $scheme;   # 漏了 → 面板 WB_SECURE_COOKIE=auto
#                                                 #        会「静默」不加 Secure
#   proxy_set_header X-Forwarded-For ...;         # 真实 IP 链路
#   proxy_set_header Connection "";               # SSE 长连接
#   proxy_read_timeout 600s;                      # 默认 60s，长对话会被掐断
#
# Caddy 全部默认就对：
#   · 默认 flush_interval 为 -1（不缓冲）→ 流式/SSE 开箱可用
#   · 默认以 $remote_addr 覆盖写入 X-Forwarded-For 与 X-Forwarded-Proto
#   · 默认无读超时上限
# 唯一需要手补的就是上面那个 X-Real-IP。
#
# ─────────────────────────────────────────────────────────────
# 可选：加 IP 白名单
# ─────────────────────────────────────────────────────────────
# 面板持有全部上游账号凭证，建议至少做一层来源限制。
# 如果前面没有 Cloudflare（注意 Clash/V2Ray 的 TUN 模式会改变源 IP）：
#
#   workbuddy.example.com {
#       tls you@example.com
#       encode gzip
#
#       @allow {
#           remote_ip 127.0.0.1 ::1
#           remote_ip 203.0.113.10      # 你的固定出口 IP
#           remote_ip 198.51.100.0/24   # 或网段
#       }
#       handle @allow {
#           reverse_proxy 127.0.0.1:17864 {
#               header_up X-Real-IP {remote_host}
#           }
#       }
#       handle {
#           respond "Forbidden" 403
#       }
#   }
#
# ⚠️ 两个坑：
#   1. 白名单里必须有你自己的 IP，否则会把自己锁在外面（改完先在另一个
#      终端确认能访问，再关掉当前会话）。
#   2. 如果用了 Cloudflare 代理（橙云），服务器看到的是 **CF 的回源 IP**
#      而不是访客真实 IP，白名单要以 CF 网段为准，否则不生效或过度放行。
#      此时更可靠的做法是 CF 侧的 Access / WAF 规则，或本机防火墙只放行
#      CF 回源网段。
