# 反向代理示例 —— Sub-Store
#
# 用法：把对应段落并入你的配置，改掉域名，然后校验并 reload。
#
# ⚠️ 唯一的坑（本文件的重要程度全在这一条）：
#    代理目标是【站点根】127.0.0.1:3001，**不要**再额外加 /<BACKEND_PATH> 前缀。
#    前端页面和后端 API 用的是同一个路径前缀，反代只负责整站转发：
#
#        浏览器                     容器内
#        GET /substore          →   GET /substore            (前端 HTML)
#        GET /substore/api/xxx  →   GET /substore/api/xxx    (接口 JSON)
#
#    若代理写成 http://127.0.0.1:3001/substore，
#    浏览器访问 /substore 时后端收到的是 /substore/substore → 404。
#
# 另一个必须记住的点：
#    改完 BACKEND_PATH 或 CORS 设置后，要重跑 ./sub-store.sh（不是 restart），
#    Docker 的环境变量只在容器创建时注入。

# ─────────────────────────────────────────────────────────────
# 一、Caddy
# ─────────────────────────────────────────────────────────────
# 假设 Sub-Store 监听 127.0.0.1:3001（脚本默认）。

sub.example.com {
    # 证书：公网域名 + 80 端口可达时，写邮箱自动申请 Let's Encrypt
    tls you@example.com
    # 无公网 80 端口时改用自签（浏览器/客户端会提示不受信）
    # tls internal

    encode gzip

    # 整站转发，不加任何路径前缀
    reverse_proxy 127.0.0.1:3001
}

# 说明：为什么这里**不需要**像其他反代那样补一堆 header？
#
#   · Sub-Store 是纯静态前端 + REST 接口，没有基于来源的鉴权逻辑，
#     不需要 X-Forwarded-Proto（没有 Secure Cookie 那类判定）。
#   · 订阅 URL 是给订阅 App（Clash / Surge / Loon 等）直接拉的，
#     App 侧没有"页面来源"概念，不带 Origin，CORS 整段逻辑不参与。
#   · Caddy 默认不缓冲响应，返回 Clash 配置这类大 body 也没问题。
#
#   唯一真正要保证的是：**走 HTTPS**。订阅链接会到处分发，
#   明文 HTTP 等于把节点列表公开。

# ─────────────────────────────────────────────────────────────
# 二、1Panel / Nginx
# ─────────────────────────────────────────────────────────────
# 在 1Panel 里可以只用图形界面：
#
#     网站 → 你的域名 → 反向代理 → 新建
#         代理地址: http://127.0.0.1:3001
#         代理路径: /
#
# 生成的配置里【要保留】这一行（1Panel 默认会加）：
#
#     proxy_set_header X-Forwarded-Proto $scheme;
#
# 如果想手写完整 server 块，参考下面：

server {
    listen 443 ssl http2;
    server_name sub.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ⚠️ 整站转发到根，不要写 /substore 后缀
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 订阅内容必须实时，绝不能命中缓存
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 订阅接口单独再兜一层：禁止任何中间层缓存
    # （路径前缀 <BACKEND_PATH> 按你实际设置改）
    location ~ ^/substore/api/sub/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store";
    }
}

# ─────────────────────────────────────────────────────────────
# 三、可选：来源 IP 限制
# ─────────────────────────────────────────────────────────────
# Sub-Store 里存的是全部机场订阅和节点明文，后台入口值得再加一层门。
#
# Caddy 写法：
#
#   sub.example.com {
#       tls you@example.com
#       encode gzip
#
#       @allow {
#           remote_ip 127.0.0.1 ::1
#           remote_ip 203.0.113.10       # 你的固定出口 IP
#       }
#       handle @allow {
#           reverse_proxy 127.0.0.1:3001
#       }
#       handle {
#           respond "Forbidden" 403
#       }
#   }
#
# ⚠️ 两个坑：
#   1. 白名单必须包含你自己的 IP，否则会把自己锁在外面。
#      改完先在另一个终端确认能访问，再关掉当前会话。
#   2. 手机上用蜂窝网络访问时出口 IP 是运营商动态 IP，白名单会失效；
#      这种情况下别用 IP 白名单，改用"路径猜不到 + HTTPS"。
#
# 注意：IP 白名单会**同时**挡住订阅 App 的拉取请求。
# 如果你在外面（非白名单 IP）也要拉订阅，就不能用这个方案。
